[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtest-metrics"
version = "0.1.0"
description = "Pure, dependency-free performance metrics for trading backtests: Sharpe, Sortino, drawdown, CAGR, Calmar, profit factor, expectancy. Handles 24/7 crypto calendars."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sergio Gómez" }]
keywords = ["backtesting", "trading", "sharpe", "drawdown", "quant", "metrics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sergiogoqui-cpu/backtest-metrics"
Issues = "https://github.com/sergiogoqui-cpu/backtest-metrics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
